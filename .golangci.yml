version: "2"
run:
  timeout: 5m
  allow-parallel-runners: true

issues:
  max-issues-per-linter: 80
  max-same-issues: 30

linters:
  enable:
    - dupl
    - errcheck
    - gocheckcompilerdirectives
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    nolintlint:
      require-specific: true
formatters:
  enable:
    - gofmt
    - goimports
