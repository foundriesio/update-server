{{/* Used by the auth package's localProvider implementation */}}
{{ template "header" .}}
    <section class="content-section">
      <h1 class="heading heading--page">{{.Title}}</h1>
      {{if .Message}}
      <section>
        <mark>{{.Message}}</mark>
      </section>
      {{end}}

      <form id="passwordChangeForm">
        <fieldset>
          <label for="currentPassword"><strong>Current Password</strong></label>
          <input type="password" name="currentPassword" id="currentPassword" autocomplete="current-password" required />
        </fieldset>
        
        <fieldset>
          <label for="newPassword"><strong>New Password</strong></label>
          <input type="password" name="newPassword" id="newPassword" autocomplete="new-password" required />
        </fieldset>
        
        <fieldset>
          <label for="confirmNewPassword"><strong>Confirm New Password</strong></label>
          <input type="password" name="confirmNewPassword" id="confirmNewPassword" autocomplete="new-password" required />
          <span id="passwordError" style="color: var(--danger-text); display: none;" role="alert" aria-live="assertive" tabindex="-1">Passwords do not match</span>
        </fieldset>

        <button type="submit">Change password</button>
      </form>
      
      {{ template "password_change_script" . }}
      <script>
        document.getElementById('passwordChangeForm').addEventListener('submit', function(e) {
          e.preventDefault();

          var newPassword = document.getElementById('newPassword').value;
          var confirmPassword = document.getElementById('confirmNewPassword').value;

          var currentPassword = document.getElementById('currentPassword').value;
          submitPasswordChange(currentPassword, newPassword, confirmPassword, 'passwordError', function() {
            window.location.reload();
            return true;
          });
        });

        setupPasswordMatchValidation('newPassword', 'confirmNewPassword', 'passwordError');
      </script>
    </section>

{{ template "footer" .}}
