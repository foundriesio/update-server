{{ template "header" .}}
    <section class="rollout-stream">
      <div class="rollout-stream__inner">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="/updates">Updates</a>
          <span class="breadcrumb__sep">/</span>
          <a href="/updates/{{.Name}}">{{.Name}}</a>
          <span class="breadcrumb__sep">/</span>
          <a href="/updates/{{.Name}}/rollouts/{{.Rollout}}">{{.Rollout}}</a>
          <span class="breadcrumb__sep">/</span>
          <span class="breadcrumb__current" aria-current="page">Progress</span>
        </nav>

        <header class="page-head heading-group heading-group--page heading-row heading-row--split">
          <div class="heading-stack">
            <h1 class="heading heading--page">{{.Rollout}} Stream</h1>
            <p class="page-subtitle connection-status heading-support">
              <span id="connection-status-dot" class="status-indicator__dot is-warning" aria-hidden="true"></span>
              <span id="connection-status" role="status" aria-live="polite" aria-atomic="true">Connecting&hellip;</span>
            </p>
          </div>
          <a class="btn-ghost rollout-stream__back" href="/updates/{{.Name}}/rollouts/{{.Rollout}}">Back to Rollout</a>
        </header>

        {{ template "tail-stream-content" .}}
      </div>
    </section>

{{ template "footer" .}}
