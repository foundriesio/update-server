{{define "password_change_script"}}
<script>
  function setupPasswordMatchValidation(newPasswordId, confirmPasswordId, errorSpanId) {
    var confirmInput = document.getElementById(confirmPasswordId);
    var newInput = document.getElementById(newPasswordId);
    var errorSpan = document.getElementById(errorSpanId);

    function checkMatch() {
      var newVal = newInput.value;
      var confirmVal = confirmInput.value;
      if (confirmVal && newVal !== confirmVal) {
        setPasswordError(errorSpan, 'Passwords do not match.', false);
      } else {
        setPasswordError(errorSpan, '', false);
      }
    }

    confirmInput.addEventListener('input', checkMatch);
    newInput.addEventListener('input', checkMatch);
    errorSpan.closest('form').addEventListener('input', function(event) {
      if (event.target !== newInput && event.target !== confirmInput) {
        checkMatch();
      }
    });
  }

  function setPasswordError(errorSpan, message, focus) {
    errorSpan.textContent = message;
    errorSpan.style.display = message ? 'block' : 'none';
    if (message && focus) {
      errorSpan.focus();
    }
  }

  var passwordPending = false;

  // Disables every button in the dialog (or form) so a request in flight cannot be
  // dismissed or repeated.
  function setPasswordPending(form, pending) {
    var scope = form.closest('dialog') || form;
    passwordPending = pending;
    form.setAttribute('aria-busy', String(pending));
    scope.querySelectorAll('button').forEach(function(button) {
      button.disabled = pending;
      if (button.type === 'submit') {
        button.dataset.label = button.dataset.label || button.textContent;
        button.textContent = pending ? 'Changing password…' : button.dataset.label;
      }
    });
  }

  function submitPasswordChange(currentPassword, newPassword, confirmPassword, errorSpanId, onSuccess) {
    var errorSpan = document.getElementById(errorSpanId);
    var form = errorSpan.closest('form');
    // A page that navigates away on success must stay locked until it unloads.
    var keepLocked = false;
    if (passwordPending) {
      return;
    }
    if (newPassword !== confirmPassword) {
      setPasswordError(errorSpan, 'New password and confirmation do not match.', true);
      return;
    }
    setPasswordError(errorSpan, '', false);

    setPasswordPending(form, true);
    var formData = new FormData();
    formData.append('currentPassword', currentPassword);
    formData.append('newPassword', newPassword);

    fetch('/users/{{.User.Username}}/password', {
      method: 'POST',
      body: formData
    })
    .then(response => {
      if (response.ok) {
        keepLocked = onSuccess ? onSuccess() === true : (window.location.reload(), true);
      } else {
        return response.text().then(errorText => {
          throw new Error(errorText || 'HTTP ' + response.status + ': ' + response.statusText);
        });
      }
    })
    .catch(error => {
      console.error('Error:', error);
      setPasswordError(errorSpan, 'Failed to change password: ' + error.message, true);
    })
    .finally(function() {
      if (!keepLocked) {
        setPasswordPending(form, false);
      }
    });
  }
</script>
{{end}}
