{{ define "configs-item-edit-dialog" }}
      <dialog id="EditConfigsFile" class="upload-dialog config-file-dialog" data-mode="add" aria-labelledby="config-file-dialog-title">
        <article>
          <div class="dlg-header">
            <h2 id="config-file-dialog-title">
              <span data-mode="add">Add New Config File</span>
              <span data-mode="edit">Edit Config File</span>
            </h2>
            <button class="dlg-close" id="config-file-close-btn" type="button" aria-label="Close dialog">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <line x1="2" y1="2" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="12" y1="2" x2="2" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="dlg-body">
            <form autocomplete="off">
              <div class="field-grid config-file-grid">
                <div class="field-row">
                  <label class="field-row__key" for="config-file-name">File name</label>
                  <input class="field-input" id="config-file-name" name="FileName" required />
                </div>
                <div class="field-row">
                  <label class="field-row__key" for="config-file-reason">Reason</label>
                  <input class="field-input" id="config-file-reason" name="Reason" />
                </div>
              </div>
              <div class="field-row config-file-field">
                <label class="field-row__key" for="config-file-on-changed">On Change Handlers</label>
                <textarea class="field-input config-file-textarea config-file-textarea--handlers" id="config-file-on-changed" name="OnChanged" aria-describedby="config-file-on-changed-hint"></textarea>
                <p class="field-row__caption" id="config-file-on-changed-hint">Handlers must be defined in <code translate="no">/usr/share/fioconfig/handlers/</code> on devices.</p>
              </div>
              <fieldset class="field-row config-file-encryption" data-mode="add"{{ if not .PubKey}} hidden{{ end }}>
                <label class="config-file-checkbox" for="config-file-encrypted">
                  <input id="config-file-encrypted" type="checkbox" name="Encrypted" aria-describedby="config-file-encrypted-hint" />
                  <span>Encrypt file content</span>
                </label>
                <p class="field-row__caption" id="config-file-encrypted-hint">Encrypted files cannot be edited; remove and re-add them instead.</p>
              </fieldset>
              <div class="field-row config-file-field">
                <label class="field-row__key" for="config-file-value">Content</label>
                <textarea class="field-input config-file-textarea config-file-textarea--content" id="config-file-value" name="Value"></textarea>
              </div>
            </form>
            <p class="config-file-dialog__status" data-config-file-status aria-live="polite" role="status" tabindex="-1"></p>
          </div>
          <div class="dlg-footer">
            <button class="dlg-btn dlg-btn-cancel" id="config-file-cancel-btn" type="button">Cancel</button>
            <button class="dlg-btn dlg-btn-config-save" type="button" name="save">
              <span data-mode="add">Add Config File</span>
              <span data-mode="edit">Save Changes</span>
            </button>
          </div>
        </article>
      </dialog>
      <script type="module">
        export const config = {
          'apiUrl': location.pathname, // PATCH usually sits at the same URL as the page itself.
          'addButtonName': 'AddFile',
          'editButtonName': 'EditFile',
          'fileNameCell': 'FileName',
        }
        /* export/import of script tags does not work in Firefox, so use the window object for that */
        window.EditConfigsFileConfig = config;

        const dialog = document.querySelector('#EditConfigsFile'),
              dialogCancelButton = dialog.querySelector('#config-file-cancel-btn'),
              dialogCloseButton = dialog.querySelector('#config-file-close-btn'),
              dialogForm = dialog.querySelector('form'),
              dialogEncrypted = dialog.querySelector('input[name="Encrypted"]'),
              dialogFileName = dialog.querySelector('input[name="FileName"]'),
              dialogOnChanged = dialog.querySelector('textarea[name="OnChanged"]'),
              dialogReason = dialog.querySelector('input[name="Reason"]'),
              dialogSaveButton = dialog.querySelector('button[name="save"]'),
              dialogStatus = dialog.querySelector('[data-config-file-status]'),
              dialogValue = dialog.querySelector('textarea[name="Value"]');
        let saveInFlight = false;

        function setStatus(message, state) {
          dialogStatus.dataset.state = state || '';
          dialogStatus.setAttribute('role', state === 'error' ? 'alert' : 'status');
          dialogStatus.setAttribute('aria-live', state === 'error' ? 'assertive' : 'polite');
          dialogStatus.textContent = message || '';
          if (state === 'error') {
            dialogStatus.focus();
          }
        }

        function setSubmitting(submitting) {
          const busy = submitting ? 'true' : 'false';
          saveInFlight = submitting;
          dialogCancelButton.disabled = submitting;
          dialogCloseButton.disabled = submitting;
          dialogSaveButton.disabled = submitting;
          dialogSaveButton.setAttribute('aria-busy', busy);
          dialogForm.setAttribute('aria-busy', busy);
        }

        function resetDialogState() {
          setSubmitting(false);
          setStatus('');
          dialogFileName.setCustomValidity('');
        }

        function openAddDialog(ev) {
          ev.preventDefault();
          resetDialogState();
          dialog.dataset.mode = "add";
          dialogFileName.readOnly = false;
          dialogFileName.value = "";
          dialogEncrypted.readOnly = false;
          dialogEncrypted.checked = false;
          dialogOnChanged.value = "";
          dialogReason.value = "";
          dialogValue.value = "";
          dialog.showModal();
          dialogFileName.focus();
          autoResizeTextareas();
        }

        function openEditDialog(ev) {
          ev.preventDefault();
          const src = ev.currentTarget.closest('td').querySelector('template.config-file-edit-source').content;
          resetDialogState();
          dialog.dataset.mode = "edit";
          dialogFileName.readOnly = true;
          dialogEncrypted.readOnly = true;
          dialogEncrypted.checked = false;
          copyConfigsFileData(src);
          dialog.showModal();
          dialogReason.focus();
          autoResizeTextareas();
        }

        function copyConfigsFileData(src) {
          dialogReason.value = "";
          dialogFileName.value = src.querySelector('[data-config-file-name]').textContent.trim();
          dialogOnChanged.value = [...src.querySelectorAll('[data-config-file-on-changed] > li')]
                                  .map(li => li.textContent.trim()).join('\n');
          dialogValue.value = src.querySelector('[data-config-file-value]').textContent;
        }

        async function saveConfigFile() {
          const data = Object.fromEntries(new FormData(dialogForm));
          {{/* Fix checkbox values from "on"/"" strings to boolean. */}}
          dialogForm.querySelectorAll('input[type="checkbox"]').forEach(c => { data[c.name] = c.checked });
          data.FileName = data.FileName.trim();
          {{ if .PubKey }}
          if (data.Encrypted) {
            data.Value = await eciesEncrypt(pubkey, data.Value);
          }
          {{ end }}

          const response = await fetch(config.apiUrl, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
          });
          if (!response.ok) {
            let message = await response.text();
            try {
              const payload = JSON.parse(message);
              if (payload && payload.message) {
                message = payload.message;
              }
            } catch (_) {}
            throw new Error(message || 'Unable to save config file.');
          }
        }

        dialogSaveButton.addEventListener('click', async ev => {
          ev.preventDefault();
          if (saveInFlight) {
            return
          }
          const name = dialogFileName.value.trim();
          dialogFileName.setCustomValidity(name ? '' : 'Enter a file name.');
          if (!dialogForm.reportValidity()) {
            return
          }
          if ( dialog.dataset.mode === 'add' ) {
            if (
              [...document.querySelectorAll(`td[name="${config.fileNameCell}"]`)]
              .some(el => el.textContent.trim() === name)
            ) {
              if ( !confirm(`A file with name "${name}" already exists. Do you want to overwrite it?`) ) {
                return
              }
            }
          }
          setSubmitting(true);
          setStatus('Saving config file…', 'saving');
          try {
            await saveConfigFile();
            location.reload(); // refresh the page to get updated data.
          } catch (error) {
            console.error('Error:', error);
            setStatus(error.message || 'Unable to save config file.', 'error');
            setSubmitting(false);
          }
        });

        dialogFileName.addEventListener('input', () => { dialogFileName.setCustomValidity('') });
        dialog.addEventListener('cancel', ev => {
          if (saveInFlight) {
            ev.preventDefault();
          }
        });
        dialogCloseButton.addEventListener('click', () => { dialog.close() });
        dialogCancelButton.addEventListener('click', () => { dialog.close() });

        document.querySelectorAll(`button[name="${config.editButtonName}"]`).forEach(el => {
          el.addEventListener('click', ev => { openEditDialog(ev) });
        });
        document.querySelector(`button[name="${config.addButtonName}"]`).addEventListener('click', ev => { openAddDialog(ev) });

        /* Code implementing the field-sizing: content style properly, before it is widely adopted */
        const tx = [dialogOnChanged, dialogValue];
        function autoResizeTextareas() {
          tx.forEach(el => {
            el.style.height = '0px';
            el.style.width = '0px';
          });
          tx.forEach(el => {
            el.style.height = el.scrollHeight + 'px';
            el.style.width = el.scrollWidth + 'px';
          });
        }
        tx.forEach(el => el.addEventListener('input', autoResizeTextareas));

        {{ if .PubKey }}
        function base64UrlToBytes(s) {
          return Uint8Array.from(window.atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
        }

        function bytesToBase64Std(b) {
          return window.btoa(String.fromCharCode(...b));
        }

        const pubkey = base64UrlToBytes('{{ .PubKey }}');

        {{/* Functions below closely resemble corresponding functions in https://github.com/foundriesio/go-ecies/blob/main/ecies.go /*}}
        {{/* Use browser-native window.crypto.subtle package, available in all modern PC and mobile browsers for a decade. */}}
        {{/* This code only supports P256 AES128-SHA256-CTR ECIES encryption, to match what our CLI produces. September 2026. */}}

        {{/* Helper function to concatenate several byte arrays into one. */}}
        function concatArrays(...arrays) {
          const res = new Uint8Array(arrays.reduce((sum, arr) => sum + arr.length, 0));
          let offset = 0;
          for (const arr of arrays) {
            res.set(arr, offset);
            offset += arr.length;
          }
          return res;
        }

        {{/* NIST SP 800-56c Concatenation Key Derivation Function (see section 4.1) */}}
        async function concatKDF(secret, kdLen) {
          let cnt = 1;
          let k = new Uint8Array(0);
          while (k.length < kdLen) {
            {{/* An incCounter replication in JavaScript operates on integer - more efficient that mutating byte arrays in-place */}}
            const counter = new Uint8Array([
              (cnt >> 24) & 255,
              (cnt >> 16) & 255,
              (cnt >> 8) & 255,
              cnt & 255
            ]);
            const data = concatArrays(counter, secret);
            const hash = await window.crypto.subtle.digest("SHA-256", data);
            k = concatArrays(k, new Uint8Array(hash));
            cnt++;
          }
          return k.slice(0, kdLen);
        }

        {{/* messageTag computes the MAC of a message (called the tag) as per SEC 1, 3.5. */}}
        async function messageTag(km, msg) {
          const mac = await window.crypto.subtle.importKey('raw', km, {name: 'HMAC', hash: 'SHA-256'}, false, ['sign']);
          const tag = await window.crypto.subtle.sign('HMAC', mac, msg);
          return new Uint8Array(tag);
        }

        {{/* symEncrypt carries out CTR encryption using the AES128-SHA256 block cipher. */}}
        async function symEncrypt(ke, msg) {
          const iv = window.crypto.getRandomValues(new Uint8Array(16));
          const c = await window.crypto.subtle.importKey('raw', ke, {name: 'AES-CTR'}, false, ['encrypt']);
          const ctr = await window.crypto.subtle.encrypt({name: 'AES-CTR', counter: iv, length: 64}, c, msg);
          return concatArrays(iv, new Uint8Array(ctr));
        }

        {{/* Encrypt encrypts a message using ECIES as specified in SEC 1, 5.1. Unused shared information parameter are excluded. */}}
        async function eciesEncrypt(pubkey, msg) {
          {{/* Variable names match those of go-ecies Encrypt function; s1 and s2 are unused; params set to P256+AES128-SHA256-CTR. */}}
          const p = await window.crypto.subtle.importKey("raw", pubkey, {name: "ECDH", namedCurve: "P-256"}, false, []);
          const R = await window.crypto.subtle.generateKey({name: "ECDH", namedCurve: "P-256"}, true, ["deriveBits"]);
          const z = await window.crypto.subtle.deriveBits({name: "ECDH", public: p}, R.privateKey, 256);
          const K = await concatKDF(new Uint8Array(z), 32);
          const Ke = K.slice(0, 16);
          const Km = new Uint8Array(await window.crypto.subtle.digest("SHA-256", K.slice(16, 32)));

          const em = await symEncrypt(Ke, new TextEncoder().encode(msg));
          const d = await messageTag(Km, em);
          const Rb = new Uint8Array(await window.crypto.subtle.exportKey("raw", R.publicKey));
          return bytesToBase64Std(concatArrays(Rb, em, d));
        }
        {{ end }}
      </script>
{{ end }}
