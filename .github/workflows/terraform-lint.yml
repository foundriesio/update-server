name: Terraform Lint
on:
  pull_request:
    paths:
      - 'contrib/terraform/**'

permissions:
  contents: read

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive contrib/terraform

      - name: terraform init & validate
        run: |
          set -e
          for dir in $(find contrib/terraform -name '*.tf' -exec dirname {} \; | sort -u); do
            echo "::group::terraform validate $dir"
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
            echo "::endgroup::"
          done

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6
        with:
          tflint_version: v0.55.1

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tflint --init --config "$GITHUB_WORKSPACE/contrib/terraform/.tflint.hcl"
          for dir in $(find contrib/terraform -name '*.tf' -exec dirname {} \; | sort -u); do
            echo "::group::tflint $dir"
            tflint --config "$GITHUB_WORKSPACE/contrib/terraform/.tflint.hcl" --chdir "$dir"
            echo "::endgroup::"
          done

  packer:
    name: packer
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
        with:
          version: "1.13.1"

      - name: packer fmt & validate
        run: |
          set -e
          for f in $(find contrib/terraform -name '*.pkr.hcl'); do
            echo "::group::packer $f"
            packer fmt -check "$f"
            packer init "$f"
            packer validate -syntax-only "$f"
            echo "::endgroup::"
          done
