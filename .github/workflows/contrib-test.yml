name: Unit Test
on:
  pull_request:

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  contrib-test:
    name: contrib-test
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '~1.24'
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # the server binary and its container build fail on LFS pointer stubs
          lfs: true

      - name: Build and test devshell
        run: |
          ./contrib/dev-shell go run github.com/foundriesio/update-server/cmd/server --help

  e2e-builds:
    name: e2e-builds
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '~1.24'
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check that e2e test can build a test image
        run: |
           cd contrib/e2e
           make build