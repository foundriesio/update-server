name: Lint
on:
  pull_request:

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  lint-policy-check:
    name: lint-bypass-policy-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Nolint Directives
        run: |
          if grep -nirPI 'nolint([^:]|$|:.*(all|bidichk|asciicheck))' --include='*.go' .; then
            echo "Golang code tries to bypass linter code security checks";
            exit 1;
          fi
          echo "Linter policy security check passed";

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '~1.24'
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install linter
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.2
